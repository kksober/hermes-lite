[project]
name = "hermes-lite"
version = "0.1.0"
description = "A lightweight agent framework with memory, skills, and multi-provider support"
requires-python = ">=3.11"
dependencies = [
    "pydantic-ai>=0.0.20",
    "pydantic>=2.0",
    "openai>=1.0",
    "anthropic>=0.30",
    "sqlite-utils>=3.0",
    "tiktoken>=0.5",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[project.scripts]
hermes-lite = "hermes_lite.cli:main"

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
